name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Project dhoondo
        run: |
          shopt -s nullglob
          echo "Repo me ye files hain:"
          ls -la
          for z in *.zip; do
            d="_unzipped/${z%.zip}"
            echo "ZIP mila: $z, khol raha hu"
            mkdir -p "$d"
            unzip -oq "$z" -d "$d"
          done
          CANDIDATES=$(find . -path ./.git -prune -o \( -name settings.gradle.kts -o -name settings.gradle \) -print)
          BEST=""
          BESTLEN=999999
          while IFS= read -r s; do
            [ -z "$s" ] && continue
            d=$(dirname "$s")
            if [ -d "$d/app/src/main/java/com/pinsettings" ]; then
              len=${#d}
              if [ "$len" -lt "$BESTLEN" ]; then
                BEST="$d"
                BESTLEN=$len
              fi
            fi
          done <<< "$CANDIDATES"
          if [ -z "$BEST" ]; then
            echo "ERROR: PinSettings ka project repo me nahi mila."
            echo "Repo me PinSettings ZIP ya uski saari files (app folder ke saath) upload karo."
            find . -path ./.git -prune -o -print | head -n 80
            exit 1
          fi
          echo "Project folder: $BEST"
          echo "PROJECT_DIR=$BEST" >> "$GITHUB_ENV"

      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Android SDK taiyaar karo
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PinSettings-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
